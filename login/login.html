layout: default
title: Sign In — Ask Krrish
permalink: /login/
---

<style>
  /* ─── TOKENS ─── */
  :root {
    --bg:#080808; --sun:255,160,60;
    --t:#f0f0f0; --t2:#8a8a8a; --t3:#404040;
    --b3:rgba(255,255,255,.015);
  }

  /* Override default layout body bg */
  body { background: #080808 !important; color: #f0f0f0 !important; }

  /* Top-right ambient glow */
  body::before {
    content:'';
    position:fixed;
    top:-200px; right:-200px;
    width:700px; height:700px;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,160,60,.045) 0%,
      rgba(255,160,60,.018) 40%,
      transparent 70%);
    pointer-events:none;
    z-index:0;
    filter:blur(40px);
  }

  /* Bottom-left faint warmth */
  body::after {
    content:'';
    position:fixed;
    bottom:-300px; left:-200px;
    width:600px; height:600px;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,160,60,.025) 0%,
      transparent 65%);
    pointer-events:none;
    z-index:0;
    filter:blur(60px);
  }

  #login-root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    z-index: 1;
  }

  .login-inner {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Logo / name */
  .login-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2.5rem;
    gap: 0.5rem;
  }

  .login-logo-mark {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    margin-bottom: 0.4rem;
  }

  .login-logo-mark img {
    height: 28px;
    object-fit: contain;
  }

  .login-logo-name {
    font-size: 1.25rem;
    font-weight: 600;
    color: #f0f0f0;
    letter-spacing: -0.02em;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .login-logo-sub {
    font-size: 0.78rem;
    color: #404040;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  /* Google button — full width, clean */
  .google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.65rem;
    padding: 0.8rem 1.25rem;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #e5e5e5;
    font-size: 0.9rem;
    font-weight: 500;
    font-family: 'Outfit', sans-serif;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .google-btn:hover:not(:disabled) {
    background: #222;
    border-color: #333;
    transform: translateY(-1px);
  }

  .google-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .google-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .google-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* Spinner */
  .g-spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: #e5e5e5;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .google-btn.loading .g-icon  { display: none; }
  .google-btn.loading .g-label { display: none; }
  .google-btn.loading .g-spinner { display: block; }

  /* Divider */
  .login-divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.25rem 0;
  }
  .login-divider-line {
    flex: 1;
    height: 1px;
    background: #1f1f1f;
  }
  .login-divider-text {
    font-size: 0.7rem;
    color: #444;
    font-family: 'Outfit', sans-serif;
    letter-spacing: 0.05em;
  }

  /* Error */
  #login-error {
    display: none;
    width: 100%;
    align-items: center;
    gap: 0.5rem;
    background: rgba(239,68,68,0.07);
    border: 1px solid rgba(239,68,68,0.18);
    border-radius: 8px;
    padding: 0.6rem 0.85rem;
    font-size: 0.8rem;
    color: #f87171;
    margin-top: 0.75rem;
    font-family: 'Outfit', sans-serif;
  }
  #login-error.show { display: flex; }

  /* Footer note */
  .login-note {
    margin-top: 2rem;
    font-size: 0.72rem;
    color: #3a3a3a;
    text-align: center;
    line-height: 1.6;
    font-family: 'Outfit', sans-serif;
  }

  .login-note a {
    color: #555;
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: color 0.15s;
  }
  .login-note a:hover { color: #888; }
</style>

<canvas id="star-canvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>

<div id="login-root">
  <div class="login-inner">

    <!-- Logo -->
    <div class="login-logo">
      <a href="/" class="login-logo-mark">
        <span class="login-logo-name">
          <span style="background:linear-gradient(135deg,rgba(255,160,60,1) 0%,rgba(255,160,60,.6) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;">SFX</span>&nbsp;Support
        </span>
      </a>
      <div class="login-logo-sub">Sign in with Google to get started</div>
    </div>

    <!-- Google Sign In -->
    <button class="google-btn" id="google-btn">
      <svg class="g-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span class="g-spinner"></span>
      <span class="g-label">Continue with Google</span>
    </button>

    <!-- Error -->
    <div id="login-error" role="alert">
      <i class="fa-solid fa-circle-exclamation" style="flex-shrink:0;font-size:0.75rem;"></i>
      <span id="login-error-msg"></span>
    </div>

    <!-- Footer -->
    <p class="login-note">
      Sign in with any Google account — no approval needed.<br>
      <a href="/contact/">Questions?</a> &nbsp;·&nbsp;
      <a href="/">Back to home</a>
    </p>

  </div>
</div>

<script src="/assets/js/star-canvas.js"></script>

<script type="module">
  import { loginWithGoogle, redirectIfLoggedIn } from "/assets/js/firebaseAuth.js";

  redirectIfLoggedIn();

  const btn      = document.getElementById("google-btn");
  const errorBox = document.getElementById("login-error");
  const errorMsg = document.getElementById("login-error-msg");

  function showError(msg) {
    errorMsg.textContent = msg;
    errorBox.classList.add("show");
  }

  btn.addEventListener("click", async () => {
    errorBox.classList.remove("show");
    btn.classList.add("loading");
    btn.disabled = true;

    const result = await loginWithGoogle();

    btn.classList.remove("loading");
    btn.disabled = false;

    if (result.success) {
      window.location.href = "/chatbot/";
    } else if (result.error) {
      showError(result.error);
    }
  });
</script>
