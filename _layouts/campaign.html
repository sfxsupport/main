<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.seo_title | default: page.title }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="keywords" content="{{ page.keywords | escape }}">
  <meta name="author" content="SFX Support">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <link rel="canonical" href="{{ page.canonical | default: page.url | absolute_url }}">
  <link rel="icon" href="/assets/images/FinalLogo.png" type="image/png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SFX Support">
  <meta property="og:title" content="{{ page.og_title | default: page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.canonical | default: page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.og_title | default: page.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image" content="{{ page.image | absolute_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://sfxsupport.com/#organization",
        "name": "SFX Support",
        "url": "https://sfxsupport.com/",
        "email": "founders@sfxsupport.com",
        "telephone": ["+91-9414849173", "+91-7611896026"],
        "logo": "https://sfxsupport.com/assets/images/FinalLogo.png"
      },
      {
        "@type": "Course",
        "@id": "https://sfxsupport.com/salesforce-training/#course",
        "name": "SFX Grove Salesforce Learning Residency",
        "description": "A guided Salesforce learning path covering administration, development, integrations, Agentforce, ClaudeForce and five portfolio projects through live sessions and revision recordings.",
        "url": "https://sfxsupport.com/salesforce-training/",
        "provider": { "@id": "https://sfxsupport.com/#organization" },
        "isAccessibleForFree": false,
        "inLanguage": "en",
        "offers": {
          "@type": "Offer",
          "price": "7999",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock",
          "url": "https://sfxsupport.com/salesforce-training/",
          "validFrom": "2026-11-12"
        },
        "hasCourseInstance": {
          "@type": "CourseInstance",
          "name": "December 2026 Salesforce Batch",
          "courseMode": "Online",
          "startDate": "2026-12-01",
          "duration": "P2M"
        },
        "teaches": [
          "Salesforce administration",
          "Apex and triggers",
          "Salesforce Flow",
          "Salesforce integrations",
          "Agentforce and ClaudeForce",
          "Project delivery and technical communication"
        ]
      },
      {
        "@type": "FAQPage",
        "@id": "https://sfxsupport.com/salesforce-training/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is SFX Grove another recorded Salesforce course?",
            "acceptedAnswer": { "@type": "Answer", "text": "No. SFX Grove is structured around guided missions, project work and reviewable evidence. The aim is to help learners explain and demonstrate what they build, not only watch lessons." }
          },
          {
            "@type": "Question",
            "name": "When does the next Salesforce batch start and what is the fee?",
            "acceptedAnswer": { "@type": "Answer", "text": "The upcoming online batch starts on 1 December 2026. The two-month course fee is ₹7,999. Class days and timings are confirmed before enrollment." }
          },
          {
            "@type": "Question",
            "name": "Are live Salesforce classes recorded for revision?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes. The program includes live online sessions and recordings of those classes for revision through the learning platform during the program." }
          },
          {
            "@type": "Question",
            "name": "What is covered in the Salesforce batch?",
            "acceptedAnswer": { "@type": "Answer", "text": "The curriculum starts with Salesforce Admin and continues through Apex development, Lightning Web Components, integrations, Agentforce, ClaudeForce and five guided projects." }
          },
          {
            "@type": "Question",
            "name": "Does SFX Support guarantee a job or paid work?",
            "acceptedAnswer": { "@type": "Answer", "text": "No. There is no job guarantee. Any paid opportunity depends on visible milestone eligibility and a separate written offer. Learner outcomes vary." }
          },
          {
            "@type": "Question",
            "name": "What can I practice on SFX Forge?",
            "acceptedAnswer": { "@type": "Answer", "text": "SFX Forge currently provides 129 hands-on challenges across Apex, Triggers, SOQL and SOSL. Questions are open to read, while signing in and connecting an org enables execution and saved progress." }
          },
          {
            "@type": "Question",
            "name": "How can I ask about the next SFX batch?",
            "acceptedAnswer": { "@type": "Answer", "text": "Message SFX Support on WhatsApp at +91 94148 49173, email founders@sfxsupport.com or call the same number." }
          }
        ]
      }
    ]
  }
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BXZVYY2G7X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BXZVYY2G7X');{% if site.google_ads_id and site.google_ads_id != "" %}
    gtag('config', '{{ site.google_ads_id }}');{% endif %}
  </script>

  <link rel="stylesheet" href="/assets/css/campaign.css">
  <link rel="stylesheet" href="/assets/css/studio.css">
  <script src="/assets/js/salesforce-training.js" defer></script>
</head>
<body data-ads-lead-conversion="{% if site.google_ads_id != "" and site.google_ads_lead_label != "" and site.google_ads_id and site.google_ads_lead_label %}{{ site.google_ads_id }}/{{ site.google_ads_lead_label }}{% endif %}">
  {% include studio-header.html %}

  <nav class="sfx-course-nav" aria-label="Training page sections"><a href="#journey">Curriculum</a><a href="#projects">Projects</a><a href="#reviews">Reviews</a><a href="#faq">FAQ</a><a href="#enquire">Get batch details</a></nav>

  <main id="main-content">
    {{ content }}
  </main>

  {% include studio-footer.html %}

  <a class="mobile-whatsapp" href="https://wa.me/919414849173?text=Hi%20SFX%20Support%2C%20I%20want%20to%20enquire%20about%20the%201%20December%20two-month%20Salesforce%20course%20priced%20at%20%E2%82%B97%2C999." target="_blank" rel="noopener" data-cta="mobile_whatsapp" aria-label="Enquire for the 1 December Salesforce batch on WhatsApp">
    <span aria-hidden="true">●</span> WhatsApp us
  </a>
</body>
</html>
