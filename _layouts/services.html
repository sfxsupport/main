<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.seo_title | default: page.title }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="author" content="SFX Support">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
  <link rel="canonical" href="{{ page.canonical | default: page.url | absolute_url }}">
  <link rel="icon" href="/assets/images/FinalLogo.png" type="image/png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SFX Support">
  <meta property="og:title" content="{{ page.og_title | default: page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.canonical | default: page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">

  {% if page.service %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Service",
        "@id": "{{ page.url | absolute_url }}#service",
        "name": {{ page.service.name | jsonify }},
        "serviceType": {{ page.service.type | jsonify }},
        "description": {{ page.description | jsonify }},
        "url": "{{ page.url | absolute_url }}",
        "areaServed": "Worldwide",
        "provider": { "@type": "Organization", "name": "SFX Support", "url": "https://sfxsupport.com/", "email": "founders@sfxsupport.com" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://sfxsupport.com/" },
          { "@type": "ListItem", "position": 2, "name": "Services", "item": "https://sfxsupport.com/services/" },
          { "@type": "ListItem", "position": 3, "name": {{ page.service.name | jsonify }}, "item": "{{ page.url | absolute_url }}" }
        ]
      }{% if page.faq %},
      {
        "@type": "FAQPage",
        "mainEntity": [{% for f in page.faq %}
          { "@type": "Question", "name": {{ f.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ f.a | jsonify }} } }{% unless forloop.last %},{% endunless %}{% endfor %}
        ]
      }{% endif %}
    ]
  }
  </script>
  {% else %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "ProfessionalService",
        "@id": "https://sfxsupport.com/services/#service",
        "name": "SFX Support — Salesforce development and support",
        "url": "https://sfxsupport.com/services/",
        "email": "founders@sfxsupport.com",
        "telephone": "+91-7611896026",
        "areaServed": "Worldwide",
        "address": { "@type": "PostalAddress", "addressLocality": "Jaipur", "addressCountry": "IN" },
        "description": "{{ page.description | escape }}",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Salesforce services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Salesforce Issue Fix Sprint" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Salesforce Automation Sprint" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "LWC and integration work" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Overflow support for Salesforce partners" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Agentforce and AI usage review" } }{% for s in site.pages %}{% if s.service %},
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": {{ s.service.name | jsonify }}, "url": "{{ s.url | absolute_url }}" } }{% endif %}{% endfor %}
          ]
        }
      }
    ]
  }
  </script>
  {% endif %}

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BXZVYY2G7X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BXZVYY2G7X');
  </script>

  <link rel="stylesheet" href="/assets/css/campaign.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/services.css">
  <link rel="stylesheet" href="/assets/css/sfx-2026.css">
  <link rel="stylesheet" href="/assets/css/sfx-dark.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="/assets/js/services.js" defer></script>
  <script src="/assets/js/sfx-track.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  {% include FinalHeader.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <div class="mobile-cta" data-mobile-cta>
    <a class="mobile-cta__whatsapp" href="https://wa.me/919414849173?text={{ page.whatsapp_text | default: "Hi, I saw the SFX Salesforce services page. I need help with: " | url_encode }}" target="_blank" rel="noopener" data-cta="mobile_whatsapp">WhatsApp</a>
    <a class="mobile-cta__call" href="#enquire" data-cta="mobile_discuss">Discuss a project</a>
  </div>
</body>
</html>
