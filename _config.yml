# ── Site Settings ──────────────────────────────────────────
title: "SFX Support — Salesforce Learning, Interview Prep & AI Tools"
tagline: "Salesforce Expertise, On Demand"
description: "Free Salesforce learning, interview prep, AI tools, and expert guidance for developers, admins, and architects. Apex, LWC, Integration, Flows, SOQL — all in one place."
url: "https://sfxsupport.com"
baseurl: ""
lang: "en"

# ── Author ─────────────────────────────────────────────────
author:
  name: "SFX Support"
  url: "https://sfxsupport.com"

# ── SEO ────────────────────────────────────────────────────
logo: "/assets/images/FinalLogo.png"
keywords: "Salesforce developer, Salesforce interview questions, Apex triggers interview, LWC interview questions, Salesforce learning, Salesforce AI, Salesforce debug log analyzer, SOQL interview, Salesforce flows, Salesforce integration, Salesforce admin interview, Salesforce certification prep, Salesforce interview preparation"

# ── Build Settings ─────────────────────────────────────────
theme: minima
plugins:
  - jekyll-feed

# ── Exclude from processing ────────────────────────────────
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - package.json
  - tailwind.config.js
  - src/
