# ── Site Settings ──────────────────────────────────────────
title: "SFX Support — Salesforce + AI Solutions: Agentforce, Prompt Builder & LLM Integrations"
tagline: "Salesforce + AI, built right"
description: "Salesforce + AI solutions: tested guides, tools and expert delivery for Agentforce, Prompt Builder, Models API, Data Cloud RAG, MCP and Claude/OpenAI integrations from Apex."
url: "https://sfxsupport.com"
baseurl: ""
lang: "en"
timezone: "Asia/Kolkata"

# ── Author ─────────────────────────────────────────────────
author:
  name: "SFX Support"
  url: "https://sfxsupport.com"

# ── SEO ────────────────────────────────────────────────────
logo: "/assets/images/FinalLogo.png"
keywords: "Salesforce AI, Agentforce, Agentforce custom actions, Agentforce Apex action, Prompt Builder, Salesforce Models API, Data Cloud RAG, Salesforce MCP, call Claude API from Apex, OpenAI Salesforce integration, Salesforce AI developer, Agentforce troubleshooting, Agentforce pricing"

# Public contact details used by blog call-to-action components.
whatsapp:
  enabled: true
  number: "919414849173"
  default_message: "Hi SFX Support, I have a Salesforce question."

# ── Build Settings ─────────────────────────────────────────
theme: minima
plugins:
  - jekyll-feed

# ── Exclude from processing ────────────────────────────────
exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - GEMINI.md
  - docs/
  - scripts/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - package.json
  - tailwind.config.js
  - src/

# Google Ads conversion tracking for /salesforce-training/.
# From Google Ads > Goals > Conversions > (your lead action) > Tag setup:
#   send_to: 'AW-123456789/AbCdEfGh'  ->  google_ads_id: AW-123456789, google_ads_lead_label: AbCdEfGh
# Leave empty until the conversion action exists. The page works without them.
# Google tag from Google Ads (container that loads the Ads tag AW-18591190181).
# Installed on the campaign layout (/salesforce-training/).
google_tag_id: "GTM-NSWHW4DV"
google_ads_id: ""
